[project]
name = "jobalerts"
version = "1.0.0"
description = "Early-career SWE / AI-ML / research job alerts from public ATS APIs and GitHub lists, posted to Discord"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
bot = ["discord.py>=2.4"]   # resume bot; runs on the host, not in the Docker image

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobalerts*"]
